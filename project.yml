# XcodeGen spec. Run `xcodegen` in this folder to (re)create IntervalTimer.xcodeproj.
name: IntervalTimer
options:
  bundleIdPrefix: com.mrmallon
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    SWIFT_EMIT_LOC_STRINGS: YES
    DEVELOPMENT_TEAM: ""

packages:
  TimerKit:
    path: Packages/TimerKit

targets:
  IntervalTimer:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
      - path: SharedIOS
    dependencies:
      - package: TimerKit
      - target: IntervalTimerWatch
      - target: IntervalTimerWidgets
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Interval Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UIBackgroundModes: [audio]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.mrmallon.intervaltimer
            CFBundleURLSchemes: [intervaltimer]
        UILaunchScreen:
          UIColorName: AccentColor
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: App/IntervalTimer.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mrmallon.intervaltimer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrmallon.intervaltimer
        PRODUCT_NAME: IntervalTimer
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: true
        SUPPORTS_MACCATALYST: false
    scheme:
      testTargets:
        - IntervalTimerTests
        - IntervalTimerUITests

  IntervalTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AppTests
    dependencies:
      - target: IntervalTimer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mrmallon.intervaltimer.tests

  IntervalTimerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: IntervalTimer
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.mrmallon.intervaltimer.uitests

  IntervalTimerWatch:
    type: application
    platform: watchOS
    sources:
      - path: Watch
      - path: Shared
    dependencies:
      - package: TimerKit
    info:
      path: Watch/Info.plist
      properties:
        CFBundleDisplayName: Interval Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: com.mrmallon.intervaltimer
        WKRunsIndependentlyOfCompanionApp: true
        WKBackgroundModes: [workout-processing]
        NSHealthShareUsageDescription: Interval Timer runs a workout session so your timer keeps going with your wrist down. It doesn't read your health data.
        NSHealthUpdateUsageDescription: Interval Timer runs a workout session so your timer keeps going with your wrist down.
    entitlements:
      path: Watch/IntervalTimerWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrmallon.intervaltimer.watchkitapp
        PRODUCT_NAME: IntervalTimerWatch
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SKIP_INSTALL: YES
    scheme: {}

  IntervalTimerWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: SharedIOS
      - path: Shared/Theme.swift
      - path: Shared/Localizable.xcstrings
    dependencies:
      - package: TimerKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Interval Timer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widgets/IntervalTimerWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.mrmallon.intervaltimer]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mrmallon.intervaltimer.widgets
        PRODUCT_NAME: IntervalTimerWidgets
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        APPLICATION_EXTENSION_API_ONLY: YES
