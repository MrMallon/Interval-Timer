name: CI

# Every push to main and every pull request gets:
#   - quick: engine tests + iPhone and Watch builds (~2 min)
#   - simulator-tests: app unit + UI tests in the iOS Simulator (~14 min), on PRs
#     and manual runs. The repo is public, so these runner minutes are free.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write   # to publish test screenshots to the ci-screenshots branch

jobs:
  quick:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Test TimerKit
        working-directory: Packages/TimerKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          echo "::notice title=TimerKit tests::$(grep -E 'Executed [0-9]+ tests' test.log | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build app
        run: |
          xcodegen generate
          set +e
          xcodebuild build \
            -project IntervalTimer.xcodeproj \
            -scheme IntervalTimer \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build.log 2>&1
          code=$?
          grep -E "^/.*: warning: " build.log | sed -E 's#^.*/(App|AppTests|UITests|Packages|Shared|Watch)/#\1/#' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::warning title=Compiler::$line"; done
          grep -E "^/.*: error: " build.log | sed -E 's#^.*/(App|AppTests|UITests|Packages|Shared|Watch)/#\1/#' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error title=Compiler::$line"; done
          tail -3 build.log
          exit $code

      - name: Build Watch app
        run: |
          set +e
          xcodebuild build \
            -project IntervalTimer.xcodeproj \
            -scheme IntervalTimerWatch \
            -destination 'generic/platform=watchOS Simulator' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO > build-watch.log 2>&1
          code=$?
          grep -E "^/.*: (warning|error): " build-watch.log | sed -E 's#^.*/(App|Packages|Shared|Watch)/#\1/#' | sort -u | head -40 \
            | while IFS= read -r line; do
                case "$line" in *": error: "*) echo "::error title=Watch compiler::$line";; *) echo "::warning title=Watch compiler::$line";; esac
              done
          tail -3 build-watch.log
          apps=$(cd build/Build/Products && ls -d */*.app */*.app/Watch/*.app 2>/dev/null | tr '\n' ' ')
          echo "::notice title=Built apps::$apps"
          exit $code

      - name: Check translations
        run: |
          python3 .github/scripts/check_strings.py build Shared/Localizable.xcstrings --dump keys.json

  simulator-tests:
    if: github.event_name != 'push'
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Test TimerKit
        working-directory: Packages/TimerKit
        run: |
          set -o pipefail
          swift test 2>&1 | tee test.log
          echo "::notice title=TimerKit tests::$(grep -E 'Executed [0-9]+ tests' test.log | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Pick and boot an iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          def version(runtime):
              return [int(x) for x in runtime.split("iOS-")[1].split("-")]
          runtimes = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone") and "Pro" in d["name"]:
                      print(d["udid"]); sys.exit()
          for runtime in runtimes:
              for d in devices[runtime]:
                  if d["name"].startswith("iPhone"):
                      print(d["udid"]); sys.exit()
          ')
          xcrun simctl list devices | grep "$UDID"
          echo "::notice title=Simulator::$(xcrun simctl list devices | grep "$UDID" | sed -E 's/ \(.*//' | xargs)"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build app and tests
        run: |
          set -o pipefail
          xcodebuild build-for-testing \
            -project IntervalTimer.xcodeproj \
            -scheme IntervalTimer \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            | tee build.log | grep -E "error:|warning:|\*\* TEST BUILD (SUCCEEDED|FAILED)" || true
          # Surface compiler warnings and errors as annotations on the run.
          grep -E "^/.*: warning: " build.log | sed -E 's#^.*/(App|AppTests|UITests|Packages|Shared|Watch)/#\1/#' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::warning title=Compiler::$line"; done || true
          grep -E "^/.*: error: " build.log | sed -E 's#^.*/(App|AppTests|UITests|Packages|Shared|Watch)/#\1/#' | sort -u | head -40 \
            | while IFS= read -r line; do echo "::error title=Compiler::$line"; done || true
          grep -q "TEST BUILD SUCCEEDED" build.log

      - name: Run app tests in the simulator
        id: test
        run: |
          set +e
          xcodebuild test-without-building \
            -project IntervalTimer.xcodeproj \
            -scheme IntervalTimer \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            -resultBundlePath TestResults.xcresult \
            > test-app.log 2>&1
          code=$?
          grep -E "Test (Case|Suite).*(passed|failed)|\*\* TEST" test-app.log
          exit $code

      - name: Report results and export screenshots
        if: always() && hashFiles('TestResults.xcresult/Info.plist') != ''
        run: python3 .github/scripts/xcresult_report.py TestResults.xcresult screenshots

      - name: Publish screenshots to the ci-screenshots branch
        # Fork PRs get a read-only token, so only publish for branches in this repo.
        if: >-
          always() && hashFiles('screenshots/*.png') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        env:
          TOKEN: ${{ github.token }}
        run: |
          cd screenshots
          {
            echo "# Simulator screenshots"
            echo
            echo "From commit ${GITHUB_SHA::7} on \`${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}\`, run [#${GITHUB_RUN_NUMBER}](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
            echo
            for f in *.txt; do [ -f "$f" ] && echo "- \`${f%.txt}\`: \`$(cat "$f")\`"; done
            echo
            for f in *.png; do echo "### ${f%.png}"; echo; echo "<img src=\"$f\" width=\"320\">"; echo; done
          } > README.md
          git init -q -b ci-screenshots
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Screenshots from ${GITHUB_SHA::7}"
          git push -q -f "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-screenshots
          echo "::notice title=Screenshots::${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/tree/ci-screenshots"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            TestResults.xcresult
            screenshots
            build.log
            test-app.log
          if-no-files-found: ignore
